name: assemble-094

on:
  push:
    branches: [doneproof-0.9.3-assembly]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport
        uses: actions/checkout@v4
      - name: Checkout clean main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0
      - name: Reconstruct reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release094/patch.b64 > /tmp/doneproof-0.9.4.patch.gz
          echo '3e93b67baf337b6c0c3e689036fb252404a62d8cb6f9482d21c4116f1ba6e4a2  /tmp/doneproof-0.9.4.patch.gz' | sha256sum -c -
          gzip -dc /tmp/doneproof-0.9.4.patch.gz > /tmp/doneproof-0.9.4.patch
          echo 'e5d16e9f7349f6810ac9dd8a31fa0336439bce2f8a4552a5120f273090e252ee  /tmp/doneproof-0.9.4.patch' | sha256sum -c -
      - name: Apply exact release delta
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = '522a87d08a28503cd25dced2e20e87a834454e5c'
          git apply --check /tmp/doneproof-0.9.4.patch
          git apply /tmp/doneproof-0.9.4.patch
          git add -A
          test "$(git write-tree)" = '7e4f2ccea19faeaababa30e5e4018e938f5f48aa'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/pyproject.toml
      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python -m pip install -e '.[dev]'
          ruff check doneproof tests scripts
          python -m compileall -q doneproof tests scripts
          pytest -q
          git diff --exit-code
      - name: Build production image
        run: docker build -t doneproof:0.9.4 source
      - name: Publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'OxzoroH'
          git config user.email '72065059+Odhiambo526@users.noreply.github.com'
          git commit -m 'Finalize DoneProof v0.9.4 production pilot'
          git push --force origin HEAD:refs/heads/doneproof-0.9.3-assembled
