name: validate-reviewed-release

on:
  push:
    branches: ["doneproof-0.9.1-validation"]

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct reviewed release
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part* | base64 -d > /tmp/doneproof-0.9.1.zip
          echo "9465d10816a69f8094eb9e6e289901ca6367fa3bf5e9027d7b091265f769600b  /tmp/doneproof-0.9.1.zip" | sha256sum -c -
          mkdir -p /tmp/doneproof-0.9.1
          unzip -q /tmp/doneproof-0.9.1.zip -d /tmp/doneproof-0.9.1
          test ! -e /tmp/doneproof-0.9.1/.release
          test ! -e /tmp/doneproof-0.9.1/.github/workflows/materialize-release.yml
      - name: Validate reviewed source
        working-directory: /tmp/doneproof-0.9.1
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall doneproof
          pytest -q
          docker build -t doneproof:0.9.1 .
      - name: Publish exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DoneProof Release Bot"
          git config user.email "72065059+Odhiambo526@users.noreply.github.com"
          git checkout -B doneproof-release dcc0d2ebd45f7f81c41432056dc7ae4e0569831c
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/doneproof-0.9.1/. .
          git add -A
          git commit -m "Release DoneProof v0.9.1 — market-ready pilot"
          git push --force origin HEAD:refs/heads/doneproof-0.9.1-validated
