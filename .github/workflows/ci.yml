name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check doneproof tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall doneproof
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t doneproof:test .
      - name: Worker startup and graceful shutdown
        run: |
          trap 'docker rm -f -v doneproof-worker-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name doneproof-worker-smoke doneproof:test python -m doneproof.worker
          sleep 3
          test "$(docker inspect --format '{{.State.Running}}' doneproof-worker-smoke)" = true
          docker stop --time 15 doneproof-worker-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' doneproof-worker-smoke)" = 0

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doneproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doneproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/doneproof_test
        run: pytest -q
      - name: Comparable orchestration benchmarks
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/doneproof_test
        run: |
          python benchmarks/benchmark_orchestration.py --mode baseline --repeats 10 --output benchmarks/results/ci-before.json
          python benchmarks/benchmark_orchestration.py --mode sync --repeats 10 --output benchmarks/results/ci-after-sync.json
          python benchmarks/benchmark_orchestration.py --mode durable --postgres --repeats 10 --output benchmarks/results/ci-after-postgres.json
      - name: Save benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: orchestration-benchmarks
          path: benchmarks/results/ci-*.json

  production-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, docker, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live DoneProof production
        env:
          DONEPROOF_PRODUCTION_URL: https://www.getdoneproof.com
        run: |
          for attempt in $(seq 1 30); do
            echo "Production smoke attempt ${attempt}/30"
            if python scripts/smoke_production.py "$DONEPROOF_PRODUCTION_URL"; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become ready in time" >&2
          exit 1
