name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check doneproof tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall doneproof
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t doneproof:test .

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doneproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doneproof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/doneproof_test
        run: pytest -q tests/test_postgres.py

  production-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, docker, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for live DoneProof production
        env:
          DONEPROOF_PRODUCTION_URL: https://drep-five.vercel.app
        run: |
          for attempt in $(seq 1 30); do
            echo "Production smoke attempt ${attempt}/30"
            if python scripts/smoke_production.py "$DONEPROOF_PRODUCTION_URL"; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not become ready in time" >&2
          exit 1
