name: assemble-postgres-release

on:
  push:
    branches: ["doneproof-0.9.2-assembly"]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed application modules
        shell: bash
        run: |
          set -euo pipefail
          cat .release/app-store/* | base64 -d > /tmp/app-store.tar.gz
          echo "cbe53b9347be812ecdff50962cab97324a757246e699ff5cfaf1b27363a3bcd8  /tmp/app-store.tar.gz" | sha256sum -c -
          tar -xzf /tmp/app-store.tar.gz
          test "$(git hash-object doneproof/app.py)" = "fe7f0de8f4a4102784b2de39eec147b542984756"
          test "$(git hash-object doneproof/store.py)" = "99c190d14af67493868310ee572c40b17187c9d9"
      - name: Publish clean assembled candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DoneProof Release Bot"
          git config user.email "72065059+Odhiambo526@users.noreply.github.com"
          git rm -r .release .github/workflows/assemble-postgres-release.yml
          git add doneproof/app.py doneproof/store.py
          git commit -m "Assemble reviewed PostgreSQL modules"
          git push --force origin HEAD:refs/heads/doneproof-0.9.2-assembled
