name: install-demo

on:
  push:
    paths:
      - .github/workflows/install-demo.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install interactive demo into FastAPI surface
        run: |
          python - <<'PY'
          from pathlib import Path

          demo_path = Path('public/demo/index.html')
          html = demo_path.read_text(encoding='utf-8')
          Path('doneproof/demo.py').write_text(
              '"""Customer-facing interactive DoneProof product demo."""\n\nDEMO_HTML = ' + repr(html) + '\n',
              encoding='utf-8',
          )

          app_path = Path('doneproof/app.py')
          app = app_path.read_text(encoding='utf-8')
          if 'from .demo import DEMO_HTML\n' not in app:
              app = app.replace(
                  'from .config import Settings, get_settings\n',
                  'from .config import Settings, get_settings\nfrom .demo import DEMO_HTML\n',
                  1,
              )
          route = '''\n    @app.get("/demo", response_class=HTMLResponse, include_in_schema=False)\n    def demo():\n        return DEMO_HTML\n'''
          marker = '''    @app.get("/console", response_class=HTMLResponse, include_in_schema=False)\n    def console():\n        return CONSOLE_HTML\n'''
          if '@app.get("/demo"' not in app:
              if marker not in app:
                  raise SystemExit('console route marker not found')
              app = app.replace(marker, marker + route, 1)
          app_path.write_text(app, encoding='utf-8')

          web_path = Path('doneproof/web.py')
          web = web_path.read_text(encoding='utf-8')
          old = '<div class="actions"><a class="btn primary" href="/console">Open assurance console</a><a class="btn secondary" href="/docs">API reference</a></div>'
          new = '<div class="actions"><a class="btn primary" href="/demo">Watch 90-second demo</a><a class="btn secondary" href="/console">Open assurance console</a><a class="btn secondary" href="/docs">API reference</a></div>'
          if old in web:
              web = web.replace(old, new, 1)
          elif 'href="/demo"' not in web:
              raise SystemExit('landing action marker not found')
          web_path.write_text(web, encoding='utf-8')

          smoke_path = Path('scripts/smoke_production.py')
          smoke = smoke_path.read_text(encoding='utf-8')
          marker = '''    status, landing, _ = fetch(base, "/")\n    assert status == 200 and b"Agents act" in landing and b"DoneProof" in landing\n'''
          addition = marker + '''\n    status, demo, _ = fetch(base, "/demo")\n    assert status == 200, f"/demo returned HTTP {status}"\n    assert b"False-success demo" in demo and b"Start 90-second demo" in demo\n'''
          if 'fetch(base, "/demo")' not in smoke:
              if marker not in smoke:
                  raise SystemExit('smoke landing marker not found')
              smoke = smoke.replace(marker, addition, 1)
          smoke_path.write_text(smoke, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          bullet = '- 90-second false-success demo: https://www.getdoneproof.com/demo\n'
          if bullet not in readme:
              anchor = '- Assurance console: https://www.getdoneproof.com/console\n'
              if anchor not in readme:
                  raise SystemExit('README hosted-pilot marker not found')
              readme = readme.replace(anchor, bullet + anchor, 1)
          readme_path.write_text(readme, encoding='utf-8')

          demo_path.unlink()
          public_demo = Path('public/demo')
          if public_demo.exists() and not any(public_demo.iterdir()):
              public_demo.rmdir()
          PY
      - name: Validate patch
        run: |
          python -m compileall doneproof scripts
          python - <<'PY'
          from doneproof.demo import DEMO_HTML
          assert 'False-success demo' in DEMO_HTML
          assert 'Start 90-second demo' in DEMO_HTML
          assert 'PARTIAL' in DEMO_HTML and 'VERIFIED' in DEMO_HTML
          print('demo surface validated')
          PY
      - name: Commit installed demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doneproof/app.py doneproof/demo.py doneproof/web.py scripts/smoke_production.py README.md public/demo/index.html
          git commit -m "Add interactive false-success demo"
          git push origin HEAD:main
